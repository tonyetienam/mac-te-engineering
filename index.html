<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mac-TE Engineering</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff6b35; /* Orange theme like screenshot */
            --bg: #f9f9f9;
            --white: #ffffff;
            --text: #333333;
            --gray: #888888;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; /* Space for bottom nav */ }
        
        /* --- Top Header --- */
        .header { padding: 15px; background: var(--white); display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; }
        .search-bar { flex: 1; background: #f0f0f0; padding: 12px 15px; border-radius: 30px; display: flex; align-items: center; gap: 10px; }
        .search-bar input { border: none; background: transparent; width: 100%; outline: none; font-size: 14px; }
        .header i { font-size: 20px; color: var(--gray); }

        /* --- Banner --- */
        .banner { margin: 15px; border-radius: 15px; overflow: hidden; position: relative; height: 150px; background: #ffdcd2; display: flex; align-items: center; justify-content: space-between; padding: 20px; color: #8b3a1a; }
        .banner-text h2 { font-size: 18px; margin-bottom: 5px; }
        .banner-text button { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 20px; margin-top: 10px; font-weight: bold; cursor: pointer; }
        .banner img { height: 120px; object-fit: contain; mix-blend-mode: multiply; }

        /* --- Featured Sections --- */
        .section-header { display: flex; justify-content: space-between; padding: 0 15px; margin: 20px 0 10px; align-items: center; }
        .section-header h3 { font-size: 16px; color: var(--primary); }
        .section-header span { font-size: 12px; color: var(--gray); cursor: pointer; }
        
        .featured-scroll { display: flex; overflow-x: auto; padding: 0 15px; gap: 15px; padding-bottom: 10px; }
        .featured-scroll::-webkit-scrollbar { display: none; }
        .featured-item { min-width: 120px; background: var(--white); border-radius: 15px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .featured-item i { font-size: 30px; color: var(--primary); margin-bottom: 5px; }
        .featured-item p { font-size: 12px; font-weight: bold; }

        /* --- Product Grid --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 15px 15px; }
        .product-card { background: var(--white); border-radius: 15px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-img { height: 150px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 40px; }
        .product-info { padding: 10px; }
        .product-info h4 { font-size: 14px; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-info .price { font-size: 16px; font-weight: bold; color: #333; }
        .product-info .price span { font-size: 12px; font-weight: normal; color: var(--gray); text-decoration: line-through; margin-left: 5px; }
        
        /* --- Bottom Nav --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--white); display: flex; justify-content: space-around; padding: 10px 0 20px; border-top: 1px solid #eee; z-index: 100; }
        .nav-item { text-align: center; color: var(--gray); font-size: 10px; cursor: pointer; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <!-- 1. Header & Search -->
    <div class="header">
        <i class="fas fa-bars"></i>
        <div class="search-bar">
            <i class="fas fa-search" style="color:#ccc; font-size:14px;"></i>
            <input type="text" placeholder="Search for anything...">
        </div>
        <i class="fas fa-sliders-h"></i>
    </div>

    <!-- 2. Banner -->
    <div class="banner">
        <div class="banner-text">
            <h2>BACK IN<br>STOCK!</h2>
            <p style="font-size:12px;">Mac-TE Smart Villa</p>
            <button>Shop now</button>
        </div>
        <img src="https://images.pexels.com/photos/280229/pexels-photo-280229.jpeg" alt="Villa">
    </div>

    <!-- 3. Featured Sections -->
    <div class="section-header">
        <h3>Featured sections</h3>
        <span>See all</span>
    </div>
    <div class="featured-scroll">
        <div class="featured-item"><i class="fas fa-wind"></i><p>Air Coolers</p></div>
        <div class="featured-item"><i class="fas fa-utensils"></i><p>Air Fryers</p></div>
        <div class="featured-item"><i class="fas fa-baby"></i><p>Baby Essentials</p></div>
        <div class="featured-item"><i class="fas fa-home"></i><p>Smart Homes</p></div>
    </div>

    <!-- 4. Property Grid -->
    <div class="section-header" style="margin-top:0;">
        <h3>All properties</h3>
        <span>See all</span>
    </div>
    <div id="properties-grid" class="grid">
        <!-- Javascript will load properties here -->
        <div style="grid-column: 1/-1; text-align:center; padding:20px; color:#888;">Loading properties...</div>
    </div>

    <!-- 5. Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active"><i class="fas fa-store"></i>Shop</div>
        <div class="nav-item"><i class="fas fa-shopping-cart"></i>Cart</div>
        <div class="nav-item"><i class="fas fa-history"></i>History</div>
        <div class="nav-item"><i class="fas fa-heart"></i>Wishlist</div>
        <div class="nav-item"><i class="fas fa-user"></i>Account</div>
    </div>

    <!-- JAVASCRIPT TO FETCH PROPERTIES -->
    <script>
        const BASE_URL = 'https://mac-te-engineering.onrender.com';
        let properties = [];

        async function loadProperties() {
            try {
                const response = await fetch(`${BASE_URL}/api/properties`);
                properties = await response.json();
                renderProperties(properties);
            } catch (error) {
                document.getElementById('properties-grid').innerHTML = `<div style="grid-column:1/-1; text-align:center; color:red;">Error loading data</div>`;
            }
        }

        function renderProperties(data) {
            const grid = document.getElementById('properties-grid');
            if (data.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#888;">No properties listed yet.</div>`;
                return;
            }

            grid.innerHTML = data.map(prop => `
                <div class="product-card">
                    <div class="product-img">
                        ${prop.images && prop.images.length > 0 
                            ? `<img src="${prop.images[0]}" style="width:100%; height:100%; object-fit:cover;">` 
                            : '<i class="fas fa-home"></i>'}
                    </div>
                    <div class="product-info">
                        <h4>${prop.title}</h4>
                        <div class="price">₦${Number(prop.price_ngn).toLocaleString()}</div>
                        <button onclick="buyNow('${prop.id}')" style="width:100%; margin-top:10px; background:#ff6b35; color:white; border:none; padding:8px; border-radius:8px; cursor:pointer;">Buy Now</button>
                    </div>
                </div>
            `).join('');
        }

        // Load properties on start
        loadProperties();
    </script>
</body>
</html>
