<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mac-TE Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #f5f5f5; color: #333; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* Header */
        .header { background: #1a1a2e; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; }
        .header a { background: #ff6b35; color: white; text-decoration: none; padding: 8px 12px; border-radius: 5px; font-size: 14px; }
        
        /* Add Product Form */
        .form-card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .form-card h2 { font-size: 18px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .btn-primary { background: #ff6b35; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; }
        
        /* Product List */
        .product-list { background: white; border-radius: 10px; overflow: hidden; }
        .product-row { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .product-row:last-child { border-bottom: none; }
        .product-row h4 { font-size: 14px; margin-bottom: 3px; }
        .product-row p { font-size: 13px; color: #666; }
        .delete-btn { background: #ff4757; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        .success { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none; }

        /* Orders Section */
        .orders-section { background: white; border-radius: 10px; padding: 20px; margin-top: 20px; }
        .orders-section h2 { font-size: 18px; margin-bottom: 15px; }
        .order-row { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .order-row:last-child { border-bottom: none; }
        .order-row h4 { font-size: 14px; margin-bottom: 3px; }
        .order-row p { font-size: 13px; color: #666; }
        .status-badge { background: #ffefef; color: #ff4757; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mac-TE Admin</h1>
            <a href="https://mac-te-engineering.onrender.com">Back to Store</a>
        </div>

        <div id="message" class="success"></div>

        <div class="form-card">
            <h2>Add New Product</h2>
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="product-name" placeholder="e.g. Mac-TE Smart Air Fryer">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="product-description" rows="3" placeholder="Describe your product"></textarea>
            </div>
            <div class="form-group">
                <label>Price (₦)</label>
                <input type="number" id="product-price" placeholder="e.g. 45000">
            </div>
            <div class="form-group">
                <label>Image URL</label>
                <input type="text" id="product-image" placeholder="Paste image link here">
            </div>
            <div class="form-group">
                <label>Stock Quantity</label>
                <input type="number" id="product-stock" placeholder="e.g. 20">
            </div>
            <button class="btn-primary" onclick="addProduct()">Add Product</button>
        </div>

        <div class="product-list" id="product-list">
            <div style="padding:20px; text-align:center; color:#888;">Loading products...</div>
        </div>

        <!-- Orders Section -->
        <div class="orders-section">
            <h2>Recent Orders</h2>
            <div id="orders-list">
                <div style="padding:20px; text-align:center; color:#888;">Loading orders...</div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://mac-te-engineering.onrender.com';

        async function loadProducts() {
            try {
                const response = await fetch(`${BASE_URL}/api/products`);
                const products = await response.json();
                const list = document.getElementById('product-list');
                if (products.length === 0) {
                    list.innerHTML = `<div style="padding:20px; text-align:center; color:#888;">No products listed.</div>`;
                    return;
                }
                list.innerHTML = products.map(prod => `
                    <div class="product-row">
                        <div>
                            <h4>${prod.name}</h4>
                            <p>₦${Number(prod.price_ngn).toLocaleString()} | Stock: ${prod.stock_quantity}</p>
                        </div>
                        <button class="delete-btn" onclick="deleteProduct('${prod.id}')">Delete</button>
                    </div>
                `).join('');
            } catch (error) {
                console.error(error);
            }
        }

        async function addProduct() {
            const name = document.getElementById('product-name').value;
            const description = document.getElementById('product-description').value;
            const price_ngn = document.getElementById('product-price').value;
            const main_image = document.getElementById('product-image').value;
            const stock_quantity = document.getElementById('product-stock').value;

            const message = document.getElementById('message');
            
            if (!name || !price_ngn) {
                message.style.display = 'block';
                message.className = 'error';
                message.innerText = 'Please fill in Product Name and Price.';
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/api/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        seller_id: null,
                        category_id: null,
                        name,
                        description,
                        price_ngn: parseFloat(price_ngn),
                        stock_quantity: parseInt(stock_quantity || 0),
                        main_image
                    })
                });
                const data = await response.json();
                
                if (data.message) {
                    message.style.display = 'block';
                    message.className = 'success';
                    message.innerText = '✅ Product added successfully!';
                    document.getElementById('product-name').value = '';
                    document.getElementById('product-description').value = '';
                    document.getElementById('product-price').value = '';
                    document.getElementById('product-image').value = '';
                    document.getElementById('product-stock').value = '';
                    loadProducts();
                } else {
                    alert('Error adding product');
                }
            } catch (error) {
                alert('Network error. Try again.');
            }
        }

        async function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            
            try {
                const response = await fetch(`${BASE_URL}/api/products/${productId}`, { method: 'DELETE' });
                const data = await response.json();
                if (data.message) {
                    alert('Product deleted!');
                    loadProducts();
                }
            } catch (error) {
                alert('Error deleting product');
            }
        }

        // Load Orders
        async function loadOrders() {
            try {
                const response = await fetch(`${BASE_URL}/api/admin/orders`);
                const orders = await response.json();
                const list = document.getElementById('orders-list');
                if (orders.length === 0) {
                    list.innerHTML = `<div style="padding:20px; text-align:center; color:#888;">No orders yet.</div>`;
                    return;
                }
                list.innerHTML = orders.map(order => `
                    <div class="order-row">
                        <div>
                            <h4>Order #${order.id.slice(0, 8)}</h4>
                            <p>${order.full_name} | ${order.email}</p>
                        </div>
                        <div>
                            <strong>₦${Number(order.total_amount).toLocaleString()}</strong>
                            <span class="status-badge">${order.status}</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error(error);
            }
        }

        loadProducts();
        loadOrders();
    </script>
</body>
</html>
